%YAML:1.0

# affine: 无需相机内参，直接拟合圆周在图像中的投影椭圆。
solver_mode: "affine"

# 当前视频尺寸为 668x688，但没有对应相机的标定板数据，因此不伪造内参与畸变。
# 完成这台相机的标定后填入 K、D，并把 camera_enabled 改为 1。
camera_enabled: 0
camera_reference_width: 668
camera_reference_height: 688
fx: 0.0
fy: 0.0
cx: 0.0
cy: 0.0
k1: 0.0
k2: 0.0
p1: 0.0
p2: 0.0
k3: 0.0

# 实体参数统一放在 YAML。当前单目视频无法可靠反推出真实尺寸和俯角，因此用 0
# 表示尚未实测；affine 模式不会使用这些数值。后续实测后直接替换即可。
armor_width_m: 0.0
armor_height_m: 0.0
rotation_radius_m: 0.0
# 绕相机 X 轴的右手角度，装甲板向下俯为负，单位为度。
outpost_pitch_deg: 0.0

# 当前视频的目标区域（归一化坐标）。
roi_x_min: 0.20
roi_y_min: 0.08
roi_x_max: 0.82
roi_y_max: 0.38

# 红橙灯条检测。
red_min: 72
red_green_diff_min: 12
red_blue_diff_min: 22
min_light_area: 3.0
max_light_area: 500.0
min_light_length: 8.0
max_light_length: 42.0
min_light_ratio: 1.25
max_light_tilt_deg: 42.0

# 灯条配对。
min_pair_distance_ratio: 1.15
max_pair_distance_ratio: 3.4
max_pair_y_diff_ratio: 0.65
max_pair_length_ratio: 1.65
max_pair_angle_diff_deg: 24.0

# 观测四边形直接由两根灯带外缘构造；四项 padding 同时考虑比例和像素下限。
quad_end_padding_ratio: 0.08
quad_end_padding_min_px: 1.0
quad_side_padding_ratio: 0.15
quad_side_padding_min_px: 0.75
quad_min_area_ratio: 0.45
quad_min_opposite_edge_ratio: 0.45
quad_max_opposite_edge_ratio: 2.20

# 离线视频先从真实检测结果标定静态投影几何。
geometry_calibration_stride: 1
ellipse_ransac_iterations: 0
ellipse_inlier_threshold: 0.16
min_geometry_samples: 30

# 从真实观测学习随旋转相位变化的中心残差和四边形角点。
shape_phase_bins: 36
shape_min_samples_per_bin: 3
shape_min_covered_bins: 12
shape_smoothing_radius_bins: 2
model_offset_gain: 0.25
model_offset_max_step_px: 8.0
model_offset_max_magnitude_px: 20.0

# 相位滤波、关联及状态判定。
max_observation_distance_px: 55.0
phase_gain: 0.62
speed_gain: 0.38
acceleration_gain: 0.08
speed_prior_gain: 0.18
speed_measurement_min_ratio: 0.65
speed_measurement_max_ratio: 1.35
phase_regression_window_s: 0.75
max_phase_innovation_deg: 24.0
max_abs_speed_deg_s: 150.0

# 可选的匀速吸附。方向沿用估计值的正负，只配置速度绝对值。当前视频运动段
# 实测中位数约为 1.1106 rad/s；默认关闭，继续使用视频观测估计，不套用 2.51。
angular_speed_snap_enabled: 0
angular_speed_snap_rad_s: 1.1106
angular_speed_snap_tolerance_rad_s: 0.15

# 连续漏检达到以下帧数前继续维持模型；显示阈值不得大于模型失效阈值。
max_prediction_frames: 45

# 绿色框表示本帧检测/模型位置，红色虚线框表示未来目标。默认提前 3 帧
#（30 fps 时约 0.10 s）。若 prediction_lead_s 大于 0，程序将秒数按视频
# FPS 量化到最近的完整帧，并同步回写有效帧数和秒数；否则使用配置的帧数
# 并按视频 FPS 换算秒数。
prediction_lead_frames: 3
prediction_lead_s: 0.0
prediction_max_acceleration_deg_s2: 300.0
prediction_display_max_missed_frames: 15

# 红色未来框使用持续的 alpha-beta 预测/校正状态。参数由本视频逐帧回放统计
# 得到；同一编号内平滑中心和形状，编号切换时直接重置到下一块真实装甲板，
# 不在两块装甲板之间插值。
future_target_filter_enabled: 1
future_target_filter_position_gain: 0.55
future_target_filter_velocity_gain: 0.08
future_target_filter_shape_gain: 0.45
future_target_filter_reset_distance_px: 60.0
future_target_filter_max_dt_s: 0.20
future_target_filter_max_speed_px_s: 1050.0

# 红框与绿色观测框重合时始终保留，只切换为较细的半透明虚线。进入和退出
# 使用不同阈值形成迟滞，避免临界位置逐帧闪烁。
prediction_overlap_enter_px: 6.0
prediction_overlap_exit_px: 10.0
prediction_overlap_enter_iou: 0.55
prediction_overlap_exit_iou: 0.35
prediction_overlap_alpha: 0.45

# 同一块已检测装甲的短期位置由最近 5 个有效中心的 Theil-Sen 鲁棒直线
# 拟合外推；周期性从左端跳回右端时重开窗口，不把交接当作巨大速度。
# 状态相位门控与图像连续性门控相互独立：连续步长不超过 35 px；60--180 px
# 只有在跳变方向与此前速度相反且跨过轨道中心时才视为换板。其余候选不写入
# 速度历史，只在 timeout 内沿用此前可信速度。以下像素阈值对应 668x688 视频。
image_prediction_window_frames: 5
image_prediction_min_samples: 3
image_prediction_velocity_gain: 1.0
image_prediction_history_timeout_s: 0.15
image_prediction_max_step_px: 35.0
image_prediction_jump_min_px: 60.0
image_prediction_jump_max_px: 180.0
image_prediction_jump_direction_cos_max: -0.5
image_prediction_transition_y_tolerance_px: 8.0
image_prediction_wrap_margin_px: 8.0

# 程序从整段视频的真实换板事件学习每个固定编号的退出/进入模板、
# “轨迹进度 - 权重 * 帧龄”分数门限和独立帧龄门限。未来 3 帧是否换板由
# “空间越界、分数、帧龄”三项证据投票，达到 2 票才切换预测目标；
# 每个编号至少有 3 次事件才启用该先验。max_age 只限制独立帧龄门限的
# 离线搜索范围，weight_max 和 weight_step 控制线性分数的权重网格；
# 它们都不会写死当前视频的具体交接帧或坐标。
image_prediction_handover_prior_enabled: 1
image_prediction_handover_vote_threshold: 2
image_prediction_handover_training_max_age_frames: 30
image_prediction_handover_min_transitions_per_slot: 3
image_prediction_handover_age_weight_max_px: 20.0
image_prediction_handover_age_weight_step_px: 0.25

stationary_speed_deg_s: 4.0
uniform_acceleration_deg_s2: 28.0
mode_hold_frames: 8

# 运动先验由视频自相关自动估计；这里只限定合理的搜索区间，不指定角速度。
motion_difference_threshold: 0.80
motion_hold_frames: 4
period_search_min_s: 1.20
period_search_max_s: 2.80
