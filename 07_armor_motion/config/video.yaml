%YAML:1.0

# affine: 无需相机内参，直接拟合圆周在图像中的投影椭圆。
solver_mode: "affine"

# 相机参数统一放在这里。下列数值来自另一段 1920x1080 标定视频，当前输入为
# 668x688，因此保持禁用；只有确认相机、镜头、焦距和裁剪方式完全一致时才能开启。
camera_enabled: 0
camera_reference_width: 1920
camera_reference_height: 1080
fx: 1372.7394218124905
fy: 1371.2587694629472
cx: 965.7577184175561
cy: 542.5699696839304
k1: -0.010344678488746387
k2: -0.2988722201317528
p1: -0.0006726382957941973
p2: -0.0017065818612824668
k3: 0.8834860826499183

# 实体尺寸集中配置，单位为米；二维 affine 模式不依赖绝对尺寸，后续 PnP
# 后端可直接读取这些字段，不需要改源码。
armor_width_m: 0.135
armor_height_m: 0.055
rotation_radius_m: 0.2765

# 当前视频的目标区域（归一化坐标）。
roi_x_min: 0.20
roi_y_min: 0.08
roi_x_max: 0.82
roi_y_max: 0.38

# 红橙灯条检测。
red_min: 72
red_green_diff_min: 12
red_blue_diff_min: 22
min_light_area: 3.0
max_light_area: 500.0
min_light_length: 8.0
max_light_length: 42.0
min_light_ratio: 1.25
max_light_tilt_deg: 42.0

# 灯条配对。
min_pair_distance_ratio: 1.15
max_pair_distance_ratio: 3.4
max_pair_y_diff_ratio: 0.65
max_pair_length_ratio: 1.65
max_pair_angle_diff_deg: 24.0

# 观测四边形直接由两根灯带外缘构造；四项 padding 同时考虑比例和像素下限。
quad_end_padding_ratio: 0.08
quad_end_padding_min_px: 1.0
quad_side_padding_ratio: 0.15
quad_side_padding_min_px: 0.75
quad_min_area_ratio: 0.45
quad_min_opposite_edge_ratio: 0.45
quad_max_opposite_edge_ratio: 2.20

# 离线视频先从真实检测结果标定静态投影几何。
geometry_calibration_stride: 1
ellipse_ransac_iterations: 0
ellipse_inlier_threshold: 0.16
min_geometry_samples: 30

# 从真实观测学习随旋转相位变化的中心残差和四边形角点。
shape_phase_bins: 36
shape_min_samples_per_bin: 3
shape_min_covered_bins: 12
shape_smoothing_radius_bins: 2
model_offset_gain: 0.25
model_offset_max_step_px: 8.0
model_offset_max_magnitude_px: 20.0

# 相位滤波、关联及状态判定。
max_observation_distance_px: 55.0
phase_gain: 0.62
speed_gain: 0.38
acceleration_gain: 0.08
speed_prior_gain: 0.18
speed_measurement_min_ratio: 0.65
speed_measurement_max_ratio: 1.35
phase_regression_window_s: 0.75
max_phase_innovation_deg: 24.0
max_abs_speed_deg_s: 150.0
max_prediction_frames: 45

# 绿色框表示本帧检测/模型位置，红色虚线框表示未来目标。默认提前 3 帧
#（30 fps 时约 0.10 s）。若 prediction_lead_s 大于 0，则优先使用秒数；
# 否则程序按 lead_frames / 视频 FPS 自动换算。
prediction_lead_frames: 3
prediction_lead_s: 0.0
prediction_max_acceleration_deg_s2: 300.0
prediction_display_max_missed_frames: 15
prediction_overlap_suppression_px: 3.0
prediction_overlap_suppression_iou: 0.55

# 同一块已检测装甲的短期位置由最近 5 个有效中心的 Theil-Sen 鲁棒直线
# 拟合外推；周期性从左端跳回右端时重开窗口，不把交接当作巨大速度。
image_prediction_window_frames: 5
image_prediction_min_samples: 3
image_prediction_velocity_gain: 1.0
image_prediction_max_step_px: 30.0
image_prediction_jump_min_px: 60.0
image_prediction_transition_y_tolerance_px: 8.0
image_prediction_wrap_margin_px: 8.0

stationary_speed_deg_s: 4.0
uniform_acceleration_deg_s2: 28.0
mode_hold_frames: 8

# 运动先验由视频自相关自动估计；这里只限定合理的搜索区间，不指定角速度。
motion_difference_threshold: 0.80
motion_hold_frames: 4
period_search_min_s: 1.20
period_search_max_s: 2.80
